name: Build internal Alpha draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact v<package.json version> tag to rebuild
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Rebuild and verify release artifacts
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      release-commit: ${{ steps.release-metadata.outputs.commit }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # actions/checkout@v5.0.0 (GitHub; checks out the requested immutable tag)
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      # actions/setup-node@v6.4.0 (GitHub; exact Node and npm download cache)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install Electron binary
        run: npx install-electron --no

      - name: Validate tag, version, and artifact names
        id: release-metadata
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw 'The checked-out package version no longer matches the requested tag.'
          }
          $portable = "WenShu-$version-portable-x64.exe"
          $setup = "WenShu-$version-setup-x64.exe"
          $commit = git rev-parse HEAD
          "PORTABLE_ARTIFACT=$portable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_ARTIFACT=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "portable=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Production build
        run: npm run build

      - name: Quality gate
        run: npm run check

      - name: Electron E2E
        run: npm run test:e2e

      - name: Package and audit
        run: npm run package:win

      # Public binaries are outside the current release scope. Keep internal packages explicitly
      # unsigned and fail if signing appears unexpectedly. Artifact Signing + GitHub OIDC may be
      # added later as a separate, owner-approved public-binary task.
      - name: Verify unsigned internal artifacts, then generate final SHA-256
        shell: pwsh
        run: >-
          ./scripts/verify-windows-release.ps1
          -SignatureLevel Unsigned
          -GenerateManifest

      - name: Stage release documentation
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'LICENSE' -Destination 'release/LICENSE'
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.txt' -Destination 'release/THIRD_PARTY_NOTICES.txt'
          Copy-Item -LiteralPath 'docs/releases/v0.1.0-alpha.1.md' -Destination 'release/ALPHA_RELEASE_NOTES.md'

      # actions/attest@v4.1.1 (GitHub; optional provenance when the repository plan supports it)
      - name: Attest release artifacts when enabled
        if: vars.ENABLE_ARTIFACT_ATTESTATION == 'true'
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: |
            release/${{ steps.release-metadata.outputs.portable }}
            release/${{ steps.release-metadata.outputs.setup }}
            release/SHA256SUMS.txt

      # actions/upload-artifact@v6.0.0 (GitHub; Node 24; transfers verified artifacts within this workflow)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: wenshu-${{ env.RELEASE_TAG }}-windows-x64
          path: |
            release/${{ steps.release-metadata.outputs.portable }}
            release/${{ steps.release-metadata.outputs.setup }}
            release/${{ steps.release-metadata.outputs.setup }}.blockmap
            release/SHA256SUMS.txt
            release/LICENSE
            release/THIRD_PARTY_NOTICES.txt
            release/ALPHA_RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Upload approved Draft pre-release
    needs: build
    runs-on: windows-2025
    # WP7 signing, if authorized, belongs in this reviewer-protected environment before upload.
    environment: alpha-release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_COMMIT: ${{ needs.build.outputs.release-commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/download-artifact@v8.0.1 (GitHub; Node 24; retrieves only this workflow's verified artifact)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wenshu-${{ env.RELEASE_TAG }}-windows-x64
          path: release

      - name: Reverify SHA-256 manifest
        shell: pwsh
        run: |
          foreach ($line in Get-Content -LiteralPath 'release/SHA256SUMS.txt') {
            $parts = $line -split ' \*', 2
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'release' $parts[1])).Hash.ToLowerInvariant()
            if ($parts[0] -ne $actual) { throw "SHA-256 verification failed for $($parts[1])" }
          }

      - name: Derive release artifact names from the validated tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>.+)$') { throw 'Release tag must start with v.' }
          $version = $Matches.version
          "PORTABLE_ARTIFACT=WenShu-$version-portable-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_ARTIFACT=WenShu-$version-setup-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Draft pre-release only
        shell: pwsh
        run: |
          # This job deliberately does not check out source; select the repository explicitly.
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to modify it." }
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag `
            "release/$env:PORTABLE_ARTIFACT" `
            "release/$env:SETUP_ARTIFACT" `
            "release/$env:SETUP_ARTIFACT.blockmap" `
            'release/SHA256SUMS.txt' `
            'release/LICENSE' `
            'release/THIRD_PARTY_NOTICES.txt' `
            --draft --prerelease --title "文枢 $env:RELEASE_TAG" `
            --notes-file 'release/ALPHA_RELEASE_NOTES.md'
