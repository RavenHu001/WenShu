appId: io.github.ravenhu001.wenshu
productName: 文枢
executableName: WenShu
# v27 enables ASAR by default. Keep the object explicit so the integrity-producing
# default is reviewable without using the removed `asar: true` sentinel.
asar: {}
# `electron@43.4.1` 的 postinstall 已下载同一 Windows x64 runtime；复用它可使干净 npm ci
# 后的打包不再额外下载一份 Electron，并避免环境镜像差异。
electronDist: node_modules/electron/dist

# electron-builder 26.15.3 尚不接受 electronFuses schema；使用官方 @electron/fuses
# afterPack 路径且只在此处翻转一次。应用仍以 loadFile()/file:// 加载 renderer。
afterPack: scripts/after-pack-fuses.cjs

directories:
  buildResources: build
  output: release

# 白名单：应用包只能含构建产物、应用元数据和 electron-builder 按 production dependencies
# 递归解析的主进程运行时依赖；不从仓库根默认收集文件。
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - THIRD_PARTY_NOTICES.txt

win:
  icon: build/icon.ico
  # No trusted publisher has been selected yet. v27 requires every Windows signing
  # backend under this discriminated `win.sign` key; false is the only honest state
  # until the owner chooses signtool, HSM, PKCS#11, or Azure Artifact Signing.
  sign: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: WenShu-${version}-portable-${arch}.${ext}

nsis:
  artifactName: WenShu-${version}-setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
