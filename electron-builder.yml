appId: io.github.ravenhu001.wenshu
productName: 文枢
executableName: WenShu
# v27 enables ASAR by default. Keep the object explicit so the integrity-producing
# default is reviewable without using the removed `asar: true` sentinel.
asar: {}
# `electron@43.4.1` 的 postinstall 已下载同一 Windows x64 runtime；复用它可使干净 npm ci
# 后的打包不再额外下载一份 Electron，并避免环境镜像差异。
electronDist: node_modules/electron/dist

# Keep the audited official @electron/fuses afterPack hook as the single place that flips
# fuses before any future Authenticode signing. The app still loads its renderer with loadFile().
afterPack: scripts/after-pack-fuses.cjs

directories:
  buildResources: build
  output: release

# 白名单：应用包只能含构建产物、应用元数据和 electron-builder 按 production dependencies
# 递归解析的主进程运行时依赖；不从仓库根默认收集文件。
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.txt

win:
  icon: build/icon.ico
  # The owner selected Artifact Signing + GitHub OIDC, but Azure identity validation,
  # the certificate profile, and its exact publisher subject do not exist yet. Keep
  # local/internal packaging explicitly unsigned until those external inputs are ready.
  sign: false
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64

portable:
  artifactName: WenShu-${version}-portable-${arch}.${ext}

nsis:
  artifactName: WenShu-${version}-setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
